# -- after mesocycles alike, something changes --------------------------------

[[cases]]
name = "alike-twice"
history = [{ mesocycle = "hypertrophy" }, { mesocycle = "hypertrophy" }]
changes = true

[[cases]]
name = "alike-three-times"
history = [{ mesocycle = "hypertrophy" }, { mesocycle = "hypertrophy" }, { mesocycle = "hypertrophy" }]
changes = true

[[cases]]
name = "alike-strength"
goal = "strength"
history = [{ mesocycle = "strength" }, { mesocycle = "strength" }]
changes = true
keeps = ["Barbell_Squat", "Barbell_Bench_Press_-_Medium_Grip"]

# -- what they said outranks variation ----------------------------------------

[[cases]]
name = "loves-the-hinge"
history = [{ mesocycle = "hinge" }, { mesocycle = "hinge" }]
said = [{ conclusion = "loves the Romanian deadlift", quote = "adoro lo stacco rumeno" }]
keeps = ["Romanian_Deadlift"]
rotates = true

[[cases]]
name = "loves-the-bench"
history = [{ mesocycle = "hypertrophy" }, { mesocycle = "hypertrophy" }]
said = [{ conclusion = "the bench press is their favourite exercise", quote = "la panca piana è l'esercizio che preferisco" }]
keeps = ["Barbell_Bench_Press_-_Medium_Grip"]
rotates = true

[[cases]]
name = "loves-chin-ups"
history = [{ mesocycle = "hypertrophy" }, { mesocycle = "hypertrophy" }]
said = [{ conclusion = "loves chin-ups and wants to keep them", quote = "le trazioni a presa supina non toglietemele" }]
keeps = ["Chin-Up"]
rotates = true

[[cases]]
name = "loves-the-hinge-strength"
goal = "strength"
history = [{ mesocycle = "strength" }, { mesocycle = "strength" }]
said = [{ conclusion = "loves the Romanian deadlift", quote = "adoro lo stacco rumeno" }]
keeps = ["Romanian_Deadlift"]
changes = true

[[cases]]
name = "hates-lunges"
history = [{ mesocycle = "hypertrophy" }, { mesocycle = "hypertrophy" }]
said = [{ conclusion = "dislikes lunges and only does them because they are there", quote = "odio gli affondi, li faccio solo perché ci sono" }]
without = ["Dumbbell_Lunges"]
changes = true

[[cases]]
name = "squat-bothers-the-knee"
history = [{ mesocycle = "hypertrophy" }, { mesocycle = "hypertrophy" }]
said = [{ conclusion = "the barbell squat bothers their knee", quote = "lo squat con bilanciere mi dà fastidio al ginocchio" }]
without = ["Barbell_Squat"]
changes = true

# -- reps and rest stay inside the goal's column ------------------------------

[[cases]]
name = "ranges-hypertrophy"
history = [
  { mesocycle = "hypertrophy" },
  { mesocycle = "angles", direction = { theme = "new angles", changes = "every exercise replaced by one reaching the muscle from another angle; reps up from 8 to 10-12, rest down a step", why = "two regions of each muscle left untrained by one exercise", varies = ["exercises", "reps", "rest"] } },
]
ranges = true
changes = true

[[cases]]
name = "ranges-endurance"
goal = "muscular endurance"
history = [{ mesocycle = "endurance" }, { mesocycle = "endurance" }]
ranges = true
changes = true

[[cases]]
name = "ranges-recomposition"
goal = "recomposition"
history = [{ mesocycle = "recomposition" }, { mesocycle = "recomposition" }]
ranges = true
changes = true

[[cases]]
name = "ranges-strength"
goal = "strength"
history = [
  { mesocycle = "strength" },
  { mesocycle = "heavier", direction = { theme = "heavier", changes = "reps down by one on every lift, rest on the squat and the press up to 4 minutes; exercises kept", why = "the loads rose every cycle at 5 and 6", varies = ["reps", "rest"] } },
]
ranges = true

[[cases]]
name = "goal-now-endurance"
goal = "muscular endurance"
history = [{ mesocycle = "hypertrophy" }, { mesocycle = "hypertrophy" }]
ranges = true
reps = "more"

# -- the direction carries on the thread of the last one ----------------------

[[cases]]
name = "thread-rest"
history = [
  { mesocycle = "hypertrophy" },
  { mesocycle = "denser", direction = { theme = "density", changes = "rest shortened by a step, 120 to 90 and 90 to 75; exercises and reps kept. If every workout is done, the next mesocycle shortens it one step more, towards 60", why = "sessions run long and they want them shorter", varies = ["rest"] } },
]
varies = ["rest"]
rest = "shorter"
ranges = true

[[cases]]
name = "thread-exercises-then-reps"
history = [
  { mesocycle = "hypertrophy" },
  { mesocycle = "angles", direction = { theme = "new angles", changes = "every exercise replaced by one reaching the muscle from another angle; these are kept for the next mesocycle too, which varies reps instead", why = "regions of each muscle left untrained by one exercise", varies = ["exercises"] } },
]
varies = ["reps"]
keeps = ["Front_Barbell_Squat", "Dumbbell_Bench_Press", "One-Arm_Dumbbell_Row"]

[[cases]]
name = "thread-strength-reps"
goal = "strength"
history = [
  { mesocycle = "strength" },
  { mesocycle = "heavier", direction = { theme = "heavier", changes = "reps down by one on every lift, exercises kept; the next mesocycle takes them down to 3", why = "the loads rose every cycle at 5 and 6", varies = ["reps", "rest"] } },
]
reps = "fewer"
keeps = ["Barbell_Squat", "Barbell_Bench_Press_-_Medium_Grip"]
ranges = true
