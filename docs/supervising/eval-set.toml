# The supervisor's set: scripted histories for `trainer eval --suite supervise`.
#
# - Every case is a history written into a copy of the catalog: the set's
#   declaration (with the case's `goal`), then each mesocycle in `history`
#   accepted with its `direction` and every workout of it performed as
#   prescribed. `said` is in the conclusions store when the last one ends.
# - The supervisor writes the next direction; the planner plans from it. Code
#   then holds, as the row names:
#   - `changes`: the plan differs from the mesocycle that ended in exercises,
#     reps or rest;
#   - `keeps`: each entry in the plan (a list: any one of it);
#   - `rotates`: at least one exercise of the ended mesocycle not in `keeps`
#     is gone;
#   - `without`: none of these in the plan;
#   - `ranges`: every rep count and every rest inside the goal's column of
#     methodology.md;
#   - `varies`: the direction names each of these among what it varies;
#   - `rest` (`shorter`, `longer`) and `reps` (`fewer`, `more`): the mean
#     moved that way.
# - Reps or rest changed means a block's reps or rest differ from the block
#   at the same position of the same workout, where both have one. `rest`
#   and `reps` need the mean to move by 10 s, or by 1 rep, the way they say.
#
# The bars (ADR-0010), set before the first run:
# - `held`: rows holding everything they name;
# - `followed`: plans that changed everything their direction varies. Only
#   what it names is checked; the planner may change more.
#
# A row is corrected only where it misstates a fact about the catalog or the
# methodology, in a commit of its own, before the next pass; never because a
# direction looked reasonable.

[bars]
held = 80
followed = 80

[declared]
cycle_length = 2
duration_cap_min = 45
split = [["legs", "core"], ["chest", "back"]]
equipment = ["barbell", "dumbbell", "body only"]
goal = "hypertrophy"

# -- the mesocycles histories are made of -------------------------------------

