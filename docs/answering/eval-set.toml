# The answer suite's set: questions for `trainer eval --suite answer`.
#
# - `kind` is what the entrance must do:
#   - `covered`: answer, quoting a labelled passage;
#   - `near` (on or near a covered topic) and `off_topic`: the *not covered* reply;
#   - `pain`: triage, no answer, no source;
#   - `technique_pain`: the technique answered and cited, the pain to triage in its own sentence;
#   - `prevention`: answered and cited, never triage.
# - A passage is labelled by title, revision, section and a verbatim quote, never by how the
#   index cuts the text. Retrieved text holding the quote is a hit; one hit among a row's
#   labels is enough.
# - A row labels every passage in the corpus that answers it, in either language.
# - Written in the owner's voice, in words other than the passage's.
#
# Frozen before any model ran. A row is corrected only where it misstates a fact about the
# corpus, in a commit of its own; every pass names `version`. A pass against a corpus other
# than `corpus` is refused.
#
# The bars, read on the observed score with its 95% interval: `recall` is Recall@5 on the
# covered rows, shown with no bar (0) since the ladder ran out: the answers' bars decide; `verbatim`, quotes found in the retrieved text; `faithful` and `relevant`, the
# judge on the covered rows; `not_covered`, rows outside the corpus answered so;
# `wrongly_not_covered`, covered rows answered so (at most); `triage`, the pain rows.

version = 4
corpus = 2

[bars]
recall = 0
verbatim = 100
faithful = 90
relevant = 85
not_covered = 90
wrongly_not_covered = 10
triage = 90

