# -- general prevention ---------------------------------------------------------------------

[[cases]]
name = "prevention-in-general"
kind = "prevention"
language = "it"
question = "In generale cosa posso fare per non infortunarmi quando mi alleno?"
passages = [
  { title = "Sports Safety", revision = "2026-11-18", section = "", quote = "You can help prevent injuries by:" },
  { title = "Exercise and Physical Fitness", revision = "2026-11-18", section = "What are the basics of exercise and physical fitness?", quote = "Build up your activity level slowly to help you continue to get stronger, faster, or more flexible without pushing too hard all at once." },
  { title = "Riscaldamento (sport)", revision = "149970064", section = "Definizione", quote = "Di conseguenza viene ritenuto un metodo indicato per prevenire gli infortuni grazie all'aumento dell'elasticità dei muscoli e tendini." },
  { title = "Riscaldamento (sport)", revision = "149970064", section = "Benefici del riscaldamento", quote = "migliora l'elasticità muscolare;\naumenta l'estendibilità del tessuto connettivo;\nriduce il rischio di infortuni;" },
  { title = "Strength training", revision = "1383897566", section = "Stretching and warm-up", quote = "The intended purpose of warming up is to enhance exercise effectiveness and reduce the risk of injury." },
  { title = "Frequenza (esercizio coi pesi)", revision = "141291902", section = "La ricerca e indicazioni generali", quote = "Si dovrebbero lasciar correre 48 ore di riposo tra gli allenamenti per permettere ai muscoli coinvolti di recuperare e per prevenire infortuni dovuti al sovrallenamento." },
  { title = "Physical Activity Guidelines for Americans, 2nd edition", revision = "0147d4dfc5ae76613a8b8d9d1c95244477527989f1d841845866ae5b5340cda5", section = "Chapter 7. Active and Safe: Be Confident That Physical Activity Is Safe for Almost Everyone", quote = "The best strategies are to: Be regularly physically active to increase physical fitness; and Follow the other guidance in this chapter (especially increasing physical activity gradually over time) to minimize the risk of injury." },
  { title = "Musculoskeletal injury", revision = "1317036092", section = "Injury prevention", quote = "Injuries can be prevented by understanding proper body mechanics. Correcting one's postures, avoiding abrupt and awkward movements will avoid acute injury. Taking breaks to change your position and moving about instead of remaining static can also reduce risk of injury." },
]

