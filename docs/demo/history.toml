# The demo's history, built by `trainer demo HOME`.
#
# - `[declared]` is declared before the first mesocycle; a mesocycle naming a
#   `goal` declares it again with that goal, the day it is accepted.
# - Each mesocycle in `history` is accepted with its `direction` and every
#   workout of it performed as prescribed, except the last workout of the last
#   one: reporting it in the chat ends the mesocycle, and the supervisor and
#   the planner open the next.
# - `[loads]` is the load in kg every set of an exercise was lifted with; an
#   exercise not in it is recorded with no load.
# - Every mesocycle is checked by the validator under the declaration in force
#   before it is written, as the planner's would have been.

[declared]
cycle_length = 2
duration_cap_min = 45
split = [["legs", "core"], ["chest", "back"]]
equipment = ["barbell", "dumbbell", "body only"]
goal = "hypertrophy"

[loads]
Barbell_Squat = 80
Romanian_Deadlift = 70
Barbell_Bench_Press_-_Medium_Grip = 60
Bent_Over_Barbell_Row = 55
Dumbbell_Lunges = 14
Standing_Dumbbell_Calf_Raise = 20
Incline_Dumbbell_Press = 20
Front_Barbell_Squat = 55
Split_Squat_with_Dumbbells = 14
Dumbbell_Bench_Press = 24
One-Arm_Dumbbell_Row = 26
Dumbbell_Flyes = 12

[[history]]
mesocycle = "hypertrophy"

[[history]]
mesocycle = "angles"
direction = { theme = "new angles", changes = "every exercise swapped for one that hits the same muscle from another angle; reps from 8 to 10-12, rest one step shorter", why = "with a single exercise per muscle, parts of it go untrained", varies = ["exercises", "reps", "rest"] }

[[history]]
mesocycle = "strength"
goal = "strength"
direction = { theme = "the big lifts, heavy", changes = "squat, bench press and barbell row from the first mesocycle return, a Romanian deadlift is added and the accessories go; reps at 5-6, rest up to 3 minutes", why = "the goal is now strength, and heavy compound lifts are what train it", varies = ["exercises", "reps", "rest"] }

# -- the mesocycles the history is made of ------------------------------------

[mesocycles.hypertrophy]
cycles = 4
why = "four cycles to find the starting loads"

[[mesocycles.hypertrophy.slots]]
blocks = [
  { rounds = 4, rest = 120, reason = "the heavy compound lift, working the whole leg", items = [{ exercise_id = "Barbell_Squat", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 90, reason = "one leg at a time, to even out left and right", items = [{ exercise_id = "Dumbbell_Lunges", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 60, reason = "the calves, which the squat barely reaches", items = [{ exercise_id = "Standing_Dumbbell_Calf_Raise", prescription = { unit = "reps", amount = 15 } }] },
  { rounds = 4, rest = 60, reason = "the lower abs, which the squat does not train", items = [{ exercise_id = "Hanging_Leg_Raise", prescription = { unit = "reps", amount = 12 } }] },
  { rounds = 3, rest = 60, reason = "holding the torso still, as under the bar", items = [{ exercise_id = "Plank", prescription = { unit = "seconds", amount = 45 } }] },
]

[[mesocycles.hypertrophy.slots]]
blocks = [
  { rounds = 4, rest = 120, reason = "the heavy chest press, where progress is measured", items = [{ exercise_id = "Barbell_Bench_Press_-_Medium_Grip", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 120, reason = "the heavy pull, to balance the bench", items = [{ exercise_id = "Bent_Over_Barbell_Row", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 90, reason = "the upper chest, which the flat bench barely reaches", items = [{ exercise_id = "Incline_Dumbbell_Press", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 90, reason = "pulling from above, for lats and biceps", items = [{ exercise_id = "Chin-Up", prescription = { unit = "reps", amount = 8 } }] },
]

[mesocycles.angles]
cycles = 4
why = "four cycles, enough for the loads to climb on the new angles too"

[[mesocycles.angles.slots]]
blocks = [
  { rounds = 4, rest = 90, reason = "a more upright torso: more quads, less lower back", items = [{ exercise_id = "Front_Barbell_Squat", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 90, reason = "one leg at a time, with a deeper stretch at the bottom", items = [{ exercise_id = "Split_Squat_with_Dumbbells", prescription = { unit = "reps", amount = 12 } }] },
  { rounds = 4, rest = 60, reason = "the calves, which the squat barely reaches", items = [{ exercise_id = "Standing_Dumbbell_Calf_Raise", prescription = { unit = "reps", amount = 15 } }] },
  { rounds = 4, rest = 60, reason = "holding the torso still under load", items = [{ exercise_id = "Plank", prescription = { unit = "seconds", amount = 45 } }] },
  { rounds = 3, rest = 60, reason = "the lower abs, which the squat does not train", items = [{ exercise_id = "Hanging_Leg_Raise", prescription = { unit = "reps", amount = 12 } }] },
]

[[mesocycles.angles.slots]]
blocks = [
  { rounds = 4, rest = 90, reason = "dumbbells go lower than the bar: a longer range for the chest", items = [{ exercise_id = "Dumbbell_Bench_Press", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 90, reason = "one arm at a time, with a longer stretch for the lats", items = [{ exercise_id = "One-Arm_Dumbbell_Row", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 60, reason = "more sets for the chest, with bodyweight", items = [{ exercise_id = "Pushups", prescription = { unit = "reps", amount = 15 } }] },
  { rounds = 4, rest = 90, reason = "overhand grip: more lats, less biceps", items = [{ exercise_id = "Pullups", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 60, reason = "the chest at full stretch, where presses do not reach", items = [{ exercise_id = "Dumbbell_Flyes", prescription = { unit = "reps", amount = 12 } }] },
]

[mesocycles.strength]
cycles = 4
why = "four heavy cycles, then a look at how the loads went up"

[[mesocycles.strength.slots]]
blocks = [
  { rounds = 5, rest = 180, reason = "leg strength, on the lift it is measured by", items = [{ exercise_id = "Barbell_Squat", prescription = { unit = "reps", amount = 5 } }] },
  { rounds = 4, rest = 180, reason = "the back of the legs, which the squat leaves behind", items = [{ exercise_id = "Romanian_Deadlift", prescription = { unit = "reps", amount = 6 } }] },
  { rounds = 3, rest = 180, reason = "a torso that holds heavy loads", items = [{ exercise_id = "Hanging_Leg_Raise", prescription = { unit = "reps", amount = 6 } }] },
]

[[mesocycles.strength.slots]]
blocks = [
  { rounds = 5, rest = 180, reason = "pressing strength, on the lift it is measured by", items = [{ exercise_id = "Barbell_Bench_Press_-_Medium_Grip", prescription = { unit = "reps", amount = 5 } }] },
  { rounds = 4, rest = 180, reason = "pulling strength, to balance the bench", items = [{ exercise_id = "Bent_Over_Barbell_Row", prescription = { unit = "reps", amount = 6 } }] },
  { rounds = 3, rest = 180, reason = "pulling from above, heavy", items = [{ exercise_id = "Chin-Up", prescription = { unit = "reps", amount = 6 } }] },
]
