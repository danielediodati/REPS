# The demo's history, built by `trainer demo HOME`.
#
# - `[declared]` is declared before the first mesocycle; a mesocycle naming a
#   `goal` declares it again with that goal, the day it is accepted.
# - Each mesocycle in `history` is accepted with its `direction` and every
#   workout of it performed as prescribed, except the last workout of the last
#   one: reporting it in the chat ends the mesocycle, and the supervisor and
#   the planner open the next.
# - `[loads]` is the load in kg every set of an exercise was lifted with; an
#   exercise not in it is recorded with no load.
# - Every mesocycle is checked by the validator under the declaration in force
#   before it is written, as the planner's would have been.

[declared]
cycle_length = 2
duration_cap_min = 45
split = [["legs", "core"], ["chest", "back"]]
equipment = ["barbell", "dumbbell", "body only"]
goal = "hypertrophy"

[loads]
Barbell_Squat = 80
Romanian_Deadlift = 70
Barbell_Bench_Press_-_Medium_Grip = 60
Bent_Over_Barbell_Row = 55
Dumbbell_Lunges = 14
Standing_Dumbbell_Calf_Raise = 20
Incline_Dumbbell_Press = 20
Front_Barbell_Squat = 55
Split_Squat_with_Dumbbells = 14
Dumbbell_Bench_Press = 24
One-Arm_Dumbbell_Row = 26
Dumbbell_Flyes = 12

[[history]]
mesocycle = "hypertrophy"

[[history]]
mesocycle = "angles"
direction = { theme = "angoli nuovi", changes = "ogni esercizio sostituito da uno che prende lo stesso muscolo da un altro angolo; ripetizioni da 8 a 10-12, recupero un gradino più corto", why = "con un solo esercizio per muscolo, alcune sue zone restano scoperte", varies = ["exercises", "reps", "rest"] }

[[history]]
mesocycle = "strength"
goal = "strength"
direction = { theme = "i fondamentali, pesanti", changes = "tornano squat, panca e rematore col bilanciere del primo mesociclo, si aggiunge uno stacco rumeno e si tolgono i complementari; ripetizioni a 5-6, recupero fino a 3 minuti", why = "ora l'obiettivo è la forza, e la allenano i multiarticolari pesanti", varies = ["exercises", "reps", "rest"] }

# -- the mesocycles the history is made of ------------------------------------

[mesocycles.hypertrophy]
cycles = 4
why = "quattro cicli per trovare i carichi di partenza"

[[mesocycles.hypertrophy.slots]]
blocks = [
  { rounds = 4, rest = 120, reason = "il multiarticolare pesante, che lavora tutta la gamba", items = [{ exercise_id = "Barbell_Squat", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 90, reason = "una gamba alla volta, per pareggiare destra e sinistra", items = [{ exercise_id = "Dumbbell_Lunges", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 60, reason = "i polpacci, che lo squat lascia quasi fuori", items = [{ exercise_id = "Standing_Dumbbell_Calf_Raise", prescription = { unit = "reps", amount = 15 } }] },
  { rounds = 4, rest = 60, reason = "gli addominali bassi, che lo squat non allena", items = [{ exercise_id = "Hanging_Leg_Raise", prescription = { unit = "reps", amount = 12 } }] },
  { rounds = 3, rest = 60, reason = "tenere il tronco fermo, come sotto il bilanciere", items = [{ exercise_id = "Plank", prescription = { unit = "seconds", amount = 45 } }] },
]

[[mesocycles.hypertrophy.slots]]
blocks = [
  { rounds = 4, rest = 120, reason = "la spinta pesante per il petto, dove si misura il progresso", items = [{ exercise_id = "Barbell_Bench_Press_-_Medium_Grip", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 120, reason = "la tirata pesante, per bilanciare la panca", items = [{ exercise_id = "Bent_Over_Barbell_Row", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 90, reason = "la parte alta del petto, che la panca piana prende poco", items = [{ exercise_id = "Incline_Dumbbell_Press", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 90, reason = "la tirata dall'alto, per dorsali e bicipiti", items = [{ exercise_id = "Chin-Up", prescription = { unit = "reps", amount = 8 } }] },
]

[mesocycles.angles]
cycles = 4
why = "quattro cicli, quanto basta perché i carichi salgano anche sugli angoli nuovi"

[[mesocycles.angles.slots]]
blocks = [
  { rounds = 4, rest = 90, reason = "busto più dritto: più quadricipiti, meno schiena", items = [{ exercise_id = "Front_Barbell_Squat", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 90, reason = "una gamba alla volta, con più allungamento in basso", items = [{ exercise_id = "Split_Squat_with_Dumbbells", prescription = { unit = "reps", amount = 12 } }] },
  { rounds = 4, rest = 60, reason = "i polpacci, che lo squat lascia quasi fuori", items = [{ exercise_id = "Standing_Dumbbell_Calf_Raise", prescription = { unit = "reps", amount = 15 } }] },
  { rounds = 4, rest = 60, reason = "tenere il tronco fermo sotto carico", items = [{ exercise_id = "Plank", prescription = { unit = "seconds", amount = 45 } }] },
  { rounds = 3, rest = 60, reason = "gli addominali bassi, che lo squat non allena", items = [{ exercise_id = "Hanging_Leg_Raise", prescription = { unit = "reps", amount = 12 } }] },
]

[[mesocycles.angles.slots]]
blocks = [
  { rounds = 4, rest = 90, reason = "i manubri scendono più del bilanciere: più escursione per il petto", items = [{ exercise_id = "Dumbbell_Bench_Press", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 90, reason = "un braccio alla volta, con più allungamento del dorso", items = [{ exercise_id = "One-Arm_Dumbbell_Row", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 60, reason = "più serie per il petto, a corpo libero", items = [{ exercise_id = "Pushups", prescription = { unit = "reps", amount = 15 } }] },
  { rounds = 4, rest = 90, reason = "presa prona: più dorsali, meno bicipiti", items = [{ exercise_id = "Pullups", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 60, reason = "il petto in allungamento, dove le spinte non arrivano", items = [{ exercise_id = "Dumbbell_Flyes", prescription = { unit = "reps", amount = 12 } }] },
]

[mesocycles.strength]
cycles = 4
why = "quattro cicli pesanti, poi si guarda come sono saliti i carichi"

[[mesocycles.strength.slots]]
blocks = [
  { rounds = 5, rest = 180, reason = "la forza delle gambe, sul movimento che si misura", items = [{ exercise_id = "Barbell_Squat", prescription = { unit = "reps", amount = 5 } }] },
  { rounds = 4, rest = 180, reason = "la catena posteriore, che lo squat lascia indietro", items = [{ exercise_id = "Romanian_Deadlift", prescription = { unit = "reps", amount = 6 } }] },
  { rounds = 3, rest = 180, reason = "un tronco che regge i carichi pesanti", items = [{ exercise_id = "Hanging_Leg_Raise", prescription = { unit = "reps", amount = 6 } }] },
]

[[mesocycles.strength.slots]]
blocks = [
  { rounds = 5, rest = 180, reason = "la forza di spinta, sul movimento che si misura", items = [{ exercise_id = "Barbell_Bench_Press_-_Medium_Grip", prescription = { unit = "reps", amount = 5 } }] },
  { rounds = 4, rest = 180, reason = "la forza di tirata, per bilanciare la panca", items = [{ exercise_id = "Bent_Over_Barbell_Row", prescription = { unit = "reps", amount = 6 } }] },
  { rounds = 3, rest = 180, reason = "la tirata dall'alto, pesante", items = [{ exercise_id = "Chin-Up", prescription = { unit = "reps", amount = 6 } }] },
]
