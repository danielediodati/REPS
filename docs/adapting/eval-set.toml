# The adaptation set: real requests for `trainer eval --suite adapt`.
#
# - Every case is one message to the entrance, against a fixture holding the
#   declaration and the mesocycle below, with none of its workouts performed:
#   this workout is slot 1, the legs.
# - `goes` is where the message must go: a handoff the entrance offers, or
#   - `ask`: nothing started, and the answer asks which they mean;
#   - `triage`: nothing started, and the answer asks about the ache;
#   - `remember`: a conclusion kept, and nothing started.
# - `excluded` is written into the fixture for that case only, re-tested six
#   weeks after the run.
# - A case that goes to `adapt_this_workout` is planned, and code holds its plan at
#   100%: it validated, every `holds` entry is in it (a list: any one of
#   it), no `without_pattern` and no `without_named` (a substring of the
#   catalog name) is, every exercise is on `equipment`, it runs `minutes` inside the validator's window, it trains
#   none of `untrained`, with `longer` it runs past the cap, and with `told`
#   its note names the exclusion's re-test date. The validator holds none of
#   these: an adaptation answers to what the user said, so only the set can.
#
# The bar below is for judgement (ADR-0010), set before the first run: where a
# message goes. Acting where the row asks counts double, as in the log set.
#
# The catalog has no Bulgarian split squat; `Split_Squat_with_Dumbbells` and
# `Elevated_Back_Lunge` (rear foot raised, which is what a Bulgarian is) are.

today = "2026-10-01"

[bars]
routed = 80

[declared]
cycle_length = 3
duration_cap_min = 45
split = [["legs", "core"], ["chest", "shoulders", "arms"], ["back", "arms"]]
equipment = ["barbell", "dumbbell", "body only"]
goal = "hypertrophy"

[mesocycle]
cycles = 4
why = "four cycles to settle the loads"

[[mesocycle.slots]]
blocks = [
  { rounds = 5, rest = 120, reason = "the main squat", items = [{ exercise_id = "Barbell_Squat", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 90, reason = "one leg at a time", items = [{ exercise_id = "Dumbbell_Lunges", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 60, reason = "calves", items = [{ exercise_id = "Standing_Dumbbell_Calf_Raise", prescription = { unit = "reps", amount = 15 } }] },
  { rounds = 4, rest = 60, reason = "the trunk", items = [{ exercise_id = "Plank", prescription = { unit = "seconds", amount = 45 } }, { exercise_id = "Hanging_Leg_Raise", prescription = { unit = "reps", amount = 12 } }] },
]

[[mesocycle.slots]]
blocks = [
  { rounds = 5, rest = 120, reason = "the main press", items = [{ exercise_id = "Barbell_Bench_Press_-_Medium_Grip", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 90, reason = "overhead", items = [{ exercise_id = "Dumbbell_Shoulder_Press", prescription = { unit = "reps", amount = 10 } }] },
  { rounds = 4, rest = 60, reason = "side delts", items = [{ exercise_id = "Side_Lateral_Raise", prescription = { unit = "reps", amount = 12 } }] },
  { rounds = 4, rest = 60, reason = "volume to finish", items = [{ exercise_id = "Pushups", prescription = { unit = "reps", amount = 15 } }, { exercise_id = "Dips_-_Triceps_Version", prescription = { unit = "reps", amount = 10 } }] },
]

[[mesocycle.slots]]
blocks = [
  { rounds = 5, rest = 120, reason = "the main row", items = [{ exercise_id = "Bent_Over_Barbell_Row", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 90, reason = "the vertical pull", items = [{ exercise_id = "Chin-Up", prescription = { unit = "reps", amount = 8 } }] },
  { rounds = 4, rest = 60, reason = "the arms", items = [{ exercise_id = "Dumbbell_Bicep_Curl", prescription = { unit = "reps", amount = 12 } }, { exercise_id = "Hammer_Curls", prescription = { unit = "reps", amount = 12 } }] },
  { rounds = 4, rest = 60, reason = "grip", items = [{ exercise_id = "Seated_Dumbbell_Palms-Up_Wrist_Curl", prescription = { unit = "reps", amount = 15 } }] },
]

# -- this workout -------------------------------------------------------------

[[cases]]
name = "superset"
says = "oggi niente squat, stacchi rumeni in superset con i bulgari"
goes = "adapt_this_workout"
without_pattern = ["squat"]
holds = ["Romanian_Deadlift", ["Split_Squat_with_Dumbbells", "Elevated_Back_Lunge"]]

[[cases]]
name = "you-choose"
