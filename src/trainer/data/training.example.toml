# The training configuration, hand-written.
#
# Copy this file to `training.toml` and edit it. ADR-0003 is why it is a file
# and not a table: these six values are declared by the user and read back by
# the user, and `git diff` on them is training history. Nothing in the engine
# writes this file -- onboarding will fill it by talking to you.

# How many workouts one complete rotation holds. Not days of the week: the
# rotation advances when a workout is performed, never when a date passes.
cycle_length = 4

# The minutes a workout is built to, give or take five, when no other time is
# asked for; and the most that may be asked for.
duration_cap_min = 60

# What volume is counted over. `cycle` is the value that matches how the user
# trains; it is written down rather than assumed because it is the user's call.
volume_denominator = "cycle"

# Which muscle groups each workout of the cycle trains, in order -- one entry
# per workout, so this list is exactly `cycle_length` long. The six group names
# are the ones in `src/trainer/data/muscle-groups.md`; anything else is refused
# with the six listed.
split = [
    ["chest", "shoulders", "arms"],  # push
    ["back", "arms"],                # pull
    ["legs", "core"],                # lower
    ["chest", "back", "shoulders"],  # upper
]

# What you have to train with, spelled the way the catalog spells it: run
# `trainer catalog --values equipment` for the list. This is the default a plan
# is made against when nobody says what today's equipment is, which is what
# lets the bot answer "what am I doing today?" with no other words.
equipment = ["body only", "dumbbell", "bands"]

# What this mesocycle trains for: one of the goal columns of
# `src/trainer/data/methodology.md`, which gives the planner its ranges.
# Changing it is a new mesocycle.
goal = "hypertrophy"
