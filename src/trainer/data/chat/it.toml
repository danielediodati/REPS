# What the chat says in words of its own, in Italian. Every key is in en.toml too.
# `{log}` is the log file's name, filled in on load; any other `{...}` is filled where the line is said.

[chat]
working = "Ci penso."
failed = "Qualcosa è andato storto mentre ci lavoravo. Riprova. Il motivo è scritto in {log}."
blocked = "Non posso lavorarci: c'è qualcosa da sistemare sul PC. Il motivo è scritto in {log}."
turned_down = "Non mi va questo allenamento."
exclusion = "{why}\n\nSmetto di proporti «{value}» fino al {retest_date}. Va bene?"

[buttons]
kept = "Va bene"
turned_down = "Non mi va"
confirmed = "Sì"
declined = "No"

[plan]
heading = "*Blocco {position}* · {rounds} giri · {rest}s di recupero · {minutes}:{seconds:02d}"
last = " · ultimo carico {load} kg"
last_unknown = " · ultimo carico: non lo so"
served = "*Allenamento {slot} di {slots}* · ciclo {cycle} di {cycles}"
mesocycle = "*Mesociclo* · {cycles} cicli"
slot = "*Allenamento {slot} di {slots}* · {groups}"
said_no = "  ⚠️ avevi detto di no: {why}"
total = "*Totale* {total} min su {budget}"
reps = "{amount} ripetizioni"
seconds = "{amount}s"

[progress]
looking = "guardo il catalogo"
looking_workout = "guardo il catalogo per l'allenamento {workout} di {count}"
writing = "scrivo il piano"
checking = "controllo il piano"
refused = "il validatore l'ha rimandato indietro: {rules}"
rewriting = "riscrivo il piano"
exhausted = "dopo {attempts} tentativi non ho un piano che stia nei vincoli"
valid = "piano valido, {blocks}"
one_block = "1 blocco"
blocks = "{count} blocchi"
workouts = "{count} allenamenti"
again = "va bene, ne penso un altro"
reading_report = "confronto quello che hai fatto con il piano"
writing_report = "metto giù quello che hai fatto"
read = "report letto"
not_read = "il report non è passato: {why}"
