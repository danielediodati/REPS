[project]
name = "reps-trainer"
version = "0.5.0"
description = "Reasoning Engine for Personal Strength"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "groq>=1.7.0",
    "mcp>=2,<3",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.2.3",
]

[project.scripts]
trainer = "trainer.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "types-jsonschema>=4.26.0.20260518",
    "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["src", "tests"]
