[project]
name = "reps-trainer"
version = "0.8.0"
description = "Reasoning Engine for Personal Strength"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "groq>=0.30,<1",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.31",
    "mcp>=2,<3",
    "ollama>=0.6.2",
    "psutil>=7.2.2",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.7",
]

[project.scripts]
trainer = "trainer.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "types-jsonschema>=4.26.0.20260518",
    "jsonschema>=4.26.0",
    "types-psutil>=7.2.2.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["src", "tests"]
