[project]
name = "reps-trainer"
version = "0.1.0"
description = "Reasoning Engine for Personal Strength"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click>=8.1"]

[project.scripts]
trainer = "trainer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer"]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["src", "tests"]
